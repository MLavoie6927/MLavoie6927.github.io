name: Validate Portfolio

on:
  push:
    paths:
      - "index.html"
      - "full-portfolio.html"
      - "styles.css"
      - "script.js"
      - "atlas-enterprise-v2.css"
      - "atlas-enterprise-v2.js"
      - "atlas-os-v3.css"
      - "atlas-os-v3.js"
      - "robots.txt"
      - "sitemap.xml"
      - "projects/operation-glass-meridian/**"
      - "tools/validate_site.py"
      - ".github/workflows/portfolio-ci.yml"
  pull_request:
    paths:
      - "index.html"
      - "full-portfolio.html"
      - "styles.css"
      - "script.js"
      - "atlas-enterprise-v2.css"
      - "atlas-enterprise-v2.js"
      - "atlas-os-v3.css"
      - "atlas-os-v3.js"
      - "robots.txt"
      - "sitemap.xml"
      - "projects/operation-glass-meridian/**"
      - "tools/validate_site.py"
      - ".github/workflows/portfolio-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Validate site structure and boundaries
        run: python tools/validate_site.py
      - name: Validate JavaScript syntax
        run: |
          node --check script.js
          node --check atlas-enterprise-v2.js
          node --check atlas-os-v3.js
          node --check projects/operation-glass-meridian/glass-meridian.js
          node --check projects/operation-glass-meridian/glass-meridian-v4-addon.js
