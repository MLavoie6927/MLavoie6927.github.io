<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">CrowdStrike Security Stack portfolio series roadmap</title>
  <desc id="desc">A dark security operations roadmap showing endpoint, SIEM, identity, cloud, hunting, and response as planned project areas.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b12"/>
      <stop offset="0.52" stop-color="#101723"/>
      <stop offset="1" stop-color="#090d14"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e44757"/>
      <stop offset="0.5" stop-color="#44c7ee"/>
      <stop offset="1" stop-color="#39d6a0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#4bc6ee" stroke-opacity=".08"/>
    </pattern>
  </defs>
  <rect width="1280" height="720" fill="url(#background)"/>
  <rect width="1280" height="720" fill="url(#grid)"/>
  <path d="M96 360H1184" stroke="url(#line)" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>
  <g fill="#0c1520" stroke-width="2">
    <g transform="translate(170 360)"><circle r="68" stroke="#e44757"/><circle r="49" stroke="#e44757" stroke-opacity=".35"/><text y="7" fill="#f5f8fb" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Endpoint</text></g>
    <g transform="translate(358 360)"><circle r="68" stroke="#d65c74"/><circle r="49" stroke="#d65c74" stroke-opacity=".35"/><text y="7" fill="#f5f8fb" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">SIEM</text></g>
    <g transform="translate(546 360)"><circle r="68" stroke="#8d8dd4"/><circle r="49" stroke="#8d8dd4" stroke-opacity=".35"/><text y="7" fill="#f5f8fb" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Identity</text></g>
    <g transform="translate(734 360)"><circle r="68" stroke="#48bfe3"/><circle r="49" stroke="#48bfe3" stroke-opacity=".35"/><text y="7" fill="#f5f8fb" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Cloud</text></g>
    <g transform="translate(922 360)"><circle r="68" stroke="#3dc9b0"/><circle r="49" stroke="#3dc9b0" stroke-opacity=".35"/><text y="7" fill="#f5f8fb" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Hunting</text></g>
    <g transform="translate(1110 360)"><circle r="68" stroke="#39d6a0"/><circle r="49" stroke="#39d6a0" stroke-opacity=".35"/><text y="7" fill="#f5f8fb" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Response</text></g>
  </g>
  <text x="640" y="150" fill="#f5f8fb" font-family="Arial, sans-serif" font-size="48" font-weight="800" text-anchor="middle">CrowdStrike Security Stack</text>
  <text x="640" y="205" fill="#a9c3d2" font-family="Arial, sans-serif" font-size="25" text-anchor="middle">Future project series</text>
  <rect x="474" y="560" width="332" height="54" rx="4" fill="#101a26" stroke="#e44757" stroke-opacity=".65"/>
  <text x="640" y="595" fill="#f5f8fb" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Series in development</text>
</svg>
