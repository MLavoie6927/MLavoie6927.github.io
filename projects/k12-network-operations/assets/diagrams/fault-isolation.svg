<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Evidence-First Fault Isolation</title><desc id="desc">A repeatable troubleshooting sequence that avoids random configuration changes</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="1" stop-color="#102c49"/></linearGradient>
 <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#11243a"/><stop offset="1" stop-color="#0b1929"/></linearGradient>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".35"/></filter>
 <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#7dd3fc"/></marker>
 <marker id="arrowGood" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#86efac"/></marker>
 <marker id="arrowBad" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#fca5a5"/></marker>
</defs>
<rect width="100%" height="100%" fill="url(#bg)"/>
<circle cx="1350" cy="120" r="260" fill="#16456a" opacity=".22"/>
<circle cx="180" cy="850" r="360" fill="#123b5e" opacity=".18"/>
<text x="70" y="82" fill="#7dd3fc" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="4">K–12 REGIONAL NETWORK OPERATIONS</text>
<text x="70" y="136" fill="#eaf2fc" font-family="Segoe UI,Arial,sans-serif" font-size="44" font-weight="800">Evidence-First Fault Isolation</text>
<text x="70" y="174" fill="#9fb3c8" font-family="Segoe UI,Arial,sans-serif" font-size="20">A repeatable troubleshooting sequence that avoids random configuration changes</text>
<circle cx="108" cy="288" r="28" fill="#7dd3fc" opacity=".22"/><text x="108" y="297" text-anchor="middle" fill="#7dd3fc" font-family="Segoe UI,Arial" font-size="25" font-weight="800">1</text><g filter="url(#shadow)"><rect x="150" y="250" width="290" height="120" rx="24" fill="url(#panel)" stroke="#315d82" stroke-width="2"/><text x="178" y="294" fill="#eaf2fc" font-family="Segoe UI,Arial" font-size="24" font-weight="700">Scope</text><text x="178" y="332" fill="#9fb3c8" font-family="Segoe UI,Arial" font-size="17">One user, room,</text><text x="178" y="357" fill="#9fb3c8" font-family="Segoe UI,Arial" font-size="17">building, district,</text><text x="178" y="382" fill="#9fb3c8" font-family="Segoe UI,Arial" font-size="17">or region?</text></g><circle cx="468" cy="288" r="28" fill="#7dd3fc" opacity=".22"/><text x="468" y="297" text-anchor="middle" fill="#7dd3fc" font-family="Segoe UI,Arial" font-size="25" font-weight="800">2</text><g filter="url(#shadow)"><rect x="510" y="250" width="290" height="120" rx="24" fill="url(#panel)" stroke="#315d82" stroke-width="2"/><text x="538" y="294" fill="#eaf2fc" font-family="Segoe UI,Arial" font-size="24" font-weight="700">Endpoint</text><text x="538" y="332" fill="#9fb3c8" font-family="Segoe UI,Arial" font-size="17">Link, IP, route,</text><text x="538" y="357" fill="#9fb3c8" font-family="Segoe UI,Arial" font-size="17">time, profile</text></g><circle cx="828" cy="288" r="28" fill="#7dd3fc" opacity=".22"/><text x="828" y="297" text-anchor="middle" fill="#7dd3fc" font-family="Segoe UI,Arial" font-size="25" font-weight="800">3</text><g filter="url(#shadow)"><rect x="870" y="250" width="290" height="120" rx="24" fill="url(#panel)" stroke="#315d82" stroke-width="2"/><text x="898" y="294" fill="#eaf2fc" font-family="Segoe UI,Arial" font-size="24" font-weight="700">LAN</text><text x="898" y="332" fill="#9fb3c8" font-family="Segoe UI,Arial" font-size="17">DHCP, VLAN, gateway,</text><text x="898" y="357" fill="#9fb3c8" font-family="Segoe UI,Arial" font-size="17">uplink</text></g><circle cx="1188" cy="288" r="28" fill="#7dd3fc" opacity=".22"/><text x="1188" y="297" text-anchor="middle" fill="#7dd3fc" font-family="Segoe UI,Arial" font-size="25" font-weight="800">4</text><g filter="url(#shadow)"><rect x="1230" y="250" width="290" height="120" rx="24" fill="url(#panel)" stroke="#315d82" stroke-width="2"/><text x="1258" y="294" fill="#eaf2fc" font-family="Segoe UI,Arial" font-size="24" font-weight="700">Services</text><text x="1258" y="332" fill="#9fb3c8" font-family="Segoe UI,Arial" font-size="17">DNS, NTP, HTTP/S,</text><text x="1258" y="357" fill="#9fb3c8" font-family="Segoe UI,Arial" font-size="17">mail</text></g><circle cx="1188" cy="558" r="28" fill="#7dd3fc" opacity=".22"/><text x="1188" y="567" text-anchor="middle" fill="#7dd3fc" font-family="Segoe UI,Arial" font-size="25" font-weight="800">5</text><g filter="url(#shadow)"><rect x="1230" y="520" width="290" height="120" rx="24" fill="url(#panel)" stroke="#315d82" stroke-width="2"/><text x="1258" y="564" fill="#eaf2fc" font-family="Segoe UI,Arial" font-size="24" font-weight="700">Security</text><text x="1258" y="602" fill="#9fb3c8" font-family="Segoe UI,Arial" font-size="17">Firewall, filter,</text><text x="1258" y="627" fill="#9fb3c8" font-family="Segoe UI,Arial" font-size="17">TLS, segmentation</text></g><circle cx="828" cy="558" r="28" fill="#7dd3fc" opacity=".22"/><text x="828" y="567" text-anchor="middle" fill="#7dd3fc" font-family="Segoe UI,Arial" font-size="25" font-weight="800">6</text><g filter="url(#shadow)"><rect x="870" y="520" width="290" height="120" rx="24" fill="url(#panel)" stroke="#315d82" stroke-width="2"/><text x="898" y="564" fill="#eaf2fc" font-family="Segoe UI,Arial" font-size="24" font-weight="700">WAN</text><text x="898" y="602" fill="#9fb3c8" font-family="Segoe UI,Arial" font-size="17">Edge, route,</text><text x="898" y="627" fill="#9fb3c8" font-family="Segoe UI,Arial" font-size="17">handoff, circuit</text></g><circle cx="468" cy="558" r="28" fill="#7dd3fc" opacity=".22"/><text x="468" y="567" text-anchor="middle" fill="#7dd3fc" font-family="Segoe UI,Arial" font-size="25" font-weight="800">7</text><g filter="url(#shadow)"><rect x="510" y="520" width="290" height="120" rx="24" fill="url(#panel)" stroke="#315d82" stroke-width="2"/><text x="538" y="564" fill="#eaf2fc" font-family="Segoe UI,Arial" font-size="24" font-weight="700">Cloud</text><text x="538" y="602" fill="#9fb3c8" font-family="Segoe UI,Arial" font-size="17">AD/Entra/Google/SaaS</text></g><circle cx="108" cy="558" r="28" fill="#7dd3fc" opacity=".22"/><text x="108" y="567" text-anchor="middle" fill="#7dd3fc" font-family="Segoe UI,Arial" font-size="25" font-weight="800">8</text><g filter="url(#shadow)"><rect x="150" y="520" width="290" height="120" rx="24" fill="url(#panel)" stroke="#315d82" stroke-width="2"/><text x="178" y="564" fill="#eaf2fc" font-family="Segoe UI,Arial" font-size="24" font-weight="700">Escalate</text><text x="178" y="602" fill="#9fb3c8" font-family="Segoe UI,Arial" font-size="17">Evidence + specific</text><text x="178" y="627" fill="#9fb3c8" font-family="Segoe UI,Arial" font-size="17">request</text></g><line x1="440" y1="310" x2="510" y2="310" stroke="#7dd3fc" stroke-width="4" stroke-linecap="round" stroke-dasharray="none" marker-end="url(#arrow)"/><line x1="800" y1="310" x2="870" y2="310" stroke="#7dd3fc" stroke-width="4" stroke-linecap="round" stroke-dasharray="none" marker-end="url(#arrow)"/><line x1="1160" y1="310" x2="1230" y2="310" stroke="#7dd3fc" stroke-width="4" stroke-linecap="round" stroke-dasharray="none" marker-end="url(#arrow)"/><line x1="1520" y1="310" x2="1520" y2="520" stroke="#7dd3fc" stroke-width="4" stroke-linecap="round" stroke-dasharray="none" marker-end="url(#arrow)"/><line x1="1230" y1="580" x2="1160" y2="580" stroke="#7dd3fc" stroke-width="4" stroke-linecap="round" stroke-dasharray="none" marker-end="url(#arrow)"/><line x1="870" y1="580" x2="800" y2="580" stroke="#7dd3fc" stroke-width="4" stroke-linecap="round" stroke-dasharray="none" marker-end="url(#arrow)"/><line x1="510" y1="580" x2="440" y2="580" stroke="#7dd3fc" stroke-width="4" stroke-linecap="round" stroke-dasharray="none" marker-end="url(#arrow)"/><rect x="555" y="730" width="490" height="80" rx="20" fill="#0a2237" stroke="#86efac" stroke-width="2"/><text x="800" y="764" text-anchor="middle" fill="#86efac" font-family="Segoe UI,Arial" font-size="23" font-weight="700">Change only after the failed layer is identified</text><text x="800" y="792" text-anchor="middle" fill="#9fb3c8" font-family="Segoe UI,Arial" font-size="16">Capture before/after evidence and preserve rollback.</text></svg>