<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">NOC / Vendor Escalation Workflow</title><desc id="desc">Escalation is a technical handoff, not a transfer of uncertainty</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="1" stop-color="#102c49"/></linearGradient>
 <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#11243a"/><stop offset="1" stop-color="#0b1929"/></linearGradient>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".35"/></filter>
 <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#7dd3fc"/></marker>
 <marker id="arrowGood" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#86efac"/></marker>
 <marker id="arrowBad" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#fca5a5"/></marker>
</defs>
<rect width="100%" height="100%" fill="url(#bg)"/>
<circle cx="1350" cy="120" r="260" fill="#16456a" opacity=".22"/>
<circle cx="180" cy="850" r="360" fill="#123b5e" opacity=".18"/>
<text x="70" y="82" fill="#7dd3fc" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="4">K–12 REGIONAL NETWORK OPERATIONS</text>
<text x="70" y="136" fill="#eaf2fc" font-family="Segoe UI,Arial,sans-serif" font-size="44" font-weight="800">NOC / Vendor Escalation Workflow</text>
<text x="70" y="174" fill="#9fb3c8" font-family="Segoe UI,Arial,sans-serif" font-size="20">Escalation is a technical handoff, not a transfer of uncertainty</text>
<g filter="url(#shadow)"><rect x="90" y="250" width="215" height="145" rx="24" fill="url(#panel)" stroke="#315d82" stroke-width="2"/><circle cx="132" cy="292" r="22" fill="#7dd3fc" opacity=".18"/><text x="132" y="300" text-anchor="middle" fill="#7dd3fc" font-family="Segoe UI Symbol,Segoe UI,Arial" font-size="23">1</text><text x="168" y="294" fill="#eaf2fc" font-family="Segoe UI,Arial" font-size="24" font-weight="700">Local scope</text><text x="118" y="332" fill="#9fb3c8" font-family="Segoe UI,Arial" font-size="17">Confirm users, site,</text><text x="118" y="357" fill="#9fb3c8" font-family="Segoe UI,Arial" font-size="17">VLANs, exact start</text><text x="118" y="382" fill="#9fb3c8" font-family="Segoe UI,Arial" font-size="17">time</text></g><line x1="305" y1="322" x2="340" y2="572" stroke="#7dd3fc" stroke-width="4" stroke-linecap="round" stroke-dasharray="none" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="340" y="500" width="215" height="145" rx="24" fill="url(#panel)" stroke="#315d82" stroke-width="2"/><circle cx="382" cy="542" r="22" fill="#7dd3fc" opacity=".18"/><text x="382" y="550" text-anchor="middle" fill="#7dd3fc" font-family="Segoe UI Symbol,Segoe UI,Arial" font-size="23">2</text><text x="418" y="544" fill="#eaf2fc" font-family="Segoe UI,Arial" font-size="24" font-weight="700">Known-good</text><text x="368" y="582" fill="#9fb3c8" font-family="Segoe UI,Arial" font-size="17">Prove local</text><text x="368" y="607" fill="#9fb3c8" font-family="Segoe UI,Arial" font-size="17">switching, gateway,</text><text x="368" y="632" fill="#9fb3c8" font-family="Segoe UI,Arial" font-size="17">and unaffected</text><text x="368" y="657" fill="#9fb3c8" font-family="Segoe UI,Arial" font-size="17">services</text></g><line x1="555" y1="572" x2="590" y2="322" stroke="#7dd3fc" stroke-width="4" stroke-linecap="round" stroke-dasharray="none" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="590" y="250" width="215" height="145" rx="24" fill="url(#panel)" stroke="#315d82" stroke-width="2"/><circle cx="632" cy="292" r="22" fill="#7dd3fc" opacity=".18"/><text x="632" y="300" text-anchor="middle" fill="#7dd3fc" font-family="Segoe UI Symbol,Segoe UI,Arial" font-size="23">3</text><text x="668" y="294" fill="#eaf2fc" font-family="Segoe UI,Arial" font-size="24" font-weight="700">Path evidence</text><text x="618" y="332" fill="#9fb3c8" font-family="Segoe UI,Arial" font-size="17">DNS, trace, edge</text><text x="618" y="357" fill="#9fb3c8" font-family="Segoe UI,Arial" font-size="17">interface,</text><text x="618" y="382" fill="#9fb3c8" font-family="Segoe UI,Arial" font-size="17">firewall/filter</text><text x="618" y="407" fill="#9fb3c8" font-family="Segoe UI,Arial" font-size="17">result</text></g><line x1="805" y1="322" x2="840" y2="572" stroke="#7dd3fc" stroke-width="4" stroke-linecap="round" stroke-dasharray="none" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="840" y="500" width="215" height="145" rx="24" fill="url(#panel)" stroke="#315d82" stroke-width="2"/><circle cx="882" cy="542" r="22" fill="#7dd3fc" opacity=".18"/><text x="882" y="550" text-anchor="middle" fill="#7dd3fc" font-family="Segoe UI Symbol,Segoe UI,Arial" font-size="23">4</text><text x="918" y="544" fill="#eaf2fc" font-family="Segoe UI,Arial" font-size="24" font-weight="700">Change check</text><text x="868" y="582" fill="#9fb3c8" font-family="Segoe UI,Arial" font-size="17">Confirm relevant</text><text x="868" y="607" fill="#9fb3c8" font-family="Segoe UI,Arial" font-size="17">maintenance or</text><text x="868" y="632" fill="#9fb3c8" font-family="Segoe UI,Arial" font-size="17">recent configuration</text></g><line x1="1055" y1="572" x2="1090" y2="322" stroke="#7dd3fc" stroke-width="4" stroke-linecap="round" stroke-dasharray="none" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="1090" y="250" width="215" height="145" rx="24" fill="url(#panel)" stroke="#315d82" stroke-width="2"/><circle cx="1132" cy="292" r="22" fill="#fde68a" opacity=".18"/><text x="1132" y="300" text-anchor="middle" fill="#fde68a" font-family="Segoe UI Symbol,Segoe UI,Arial" font-size="23">5</text><text x="1168" y="294" fill="#eaf2fc" font-family="Segoe UI,Arial" font-size="24" font-weight="700">Escalation package</text><text x="1118" y="332" fill="#9fb3c8" font-family="Segoe UI,Arial" font-size="17">Circuit ID +</text><text x="1118" y="357" fill="#9fb3c8" font-family="Segoe UI,Arial" font-size="17">evidence + impact +</text><text x="1118" y="382" fill="#9fb3c8" font-family="Segoe UI,Arial" font-size="17">technical request</text></g><line x1="1305" y1="322" x2="1340" y2="572" stroke="#7dd3fc" stroke-width="4" stroke-linecap="round" stroke-dasharray="none" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="1340" y="500" width="215" height="145" rx="24" fill="url(#panel)" stroke="#315d82" stroke-width="2"/><circle cx="1382" cy="542" r="22" fill="#86efac" opacity=".18"/><text x="1382" y="550" text-anchor="middle" fill="#86efac" font-family="Segoe UI Symbol,Segoe UI,Arial" font-size="23">6</text><text x="1418" y="544" fill="#eaf2fc" font-family="Segoe UI,Arial" font-size="24" font-weight="700">Upstream action</text><text x="1368" y="582" fill="#9fb3c8" font-family="Segoe UI,Arial" font-size="17">K-</text><text x="1368" y="607" fill="#9fb3c8" font-family="Segoe UI,Arial" font-size="17">20/NOC/carrier/provi</text><text x="1368" y="632" fill="#9fb3c8" font-family="Segoe UI,Arial" font-size="17">der validates their</text><text x="1368" y="657" fill="#9fb3c8" font-family="Segoe UI,Arial" font-size="17">domain</text></g><rect x="430" y="735" width="740" height="80" rx="18" fill="#0a2237" stroke="#86efac" stroke-width="2"/><text x="800" y="770" text-anchor="middle" fill="#86efac" font-family="Segoe UI,Arial" font-size="22" font-weight="800">Good escalation: “Here is the boundary where the path fails, with timestamps and evidence.”</text></svg>