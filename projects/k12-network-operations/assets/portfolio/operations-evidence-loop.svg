</style><rect width="100%" height="100%" rx="28" class="bg"/><text x="55" y="58" class="tag" text-anchor="start">OPERATIONS METHOD</text><text x="55" y="100" class="title" text-anchor="start">Evidence → Decision → Verification Loop</text><circle cx="190" cy="290" r="92" fill="#0b2135" stroke="#67d5ff" stroke-width="2"/><text x="190" y="285" class="h" text-anchor="middle">SCOPE</text><text x="190" y="316" class="small" text-anchor="middle">who / where / impact</text><circle cx="445" cy="185" r="92" fill="#0b2135" stroke="#9d9cff" stroke-width="2"/><text x="445" y="180" class="h" text-anchor="middle">COLLECT</text><text x="445" y="211" class="small" text-anchor="middle">read-only evidence</text><circle cx="740" cy="185" r="92" fill="#0b2135" stroke="#63e6a7" stroke-width="2"/><text x="740" y="180" class="h" text-anchor="middle">ISOLATE</text><text x="740" y="211" class="small" text-anchor="middle">failed boundary</text><circle cx="995" cy="290" r="92" fill="#0b2135" stroke="#ffd166" stroke-width="2"/><text x="995" y="285" class="h" text-anchor="middle">ACT</text><text x="995" y="316" class="small" text-anchor="middle">fix or escalate</text><circle cx="865" cy="500" r="92" fill="#0b2135" stroke="#63e6a7" stroke-width="2"/><text x="865" y="495" class="h" text-anchor="middle">VERIFY</text><text x="865" y="526" class="small" text-anchor="middle">positive + negative tests</text><circle cx="475" cy="500" r="92" fill="#0b2135" stroke="#67d5ff" stroke-width="2"/><text x="475" y="495" class="h" text-anchor="middle">DOCUMENT</text><text x="475" y="526" class="small" text-anchor="middle">cause · action · result</text><path d="M190 290 Q317.5 202.5 445 185" class="line"/><path d="M445 185 Q592.5 150.0 740 185" class="line"/><path d="M740 185 Q867.5 202.5 995 290" class="line"/><path d="M995 290 Q930.0 360.0 865 500" class="line"/><path d="M865 500 Q670.0 465.0 475 500" class="line"/><path d="M475 500 Q332.5 360.0 190 290" class="line"/><text x="610" y="355" class="tag" text-anchor="middle">NO RANDOM CHANGES</text><text x="610" y="382" class="t" text-anchor="middle">Every action must be justified by observed evidence</text></svg>