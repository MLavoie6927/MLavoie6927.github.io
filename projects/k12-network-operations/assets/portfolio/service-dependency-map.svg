<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Service Dependency &amp; Blast Radius"><rect class="bg" width="1600" height="900"/><style>.bg{fill:#06111d}.panel{fill:#0b1c2b;stroke:#1f4964;stroke-width:2}.node{fill:#0d2537;stroke:#2e6687;stroke-width:2}.hi{fill:#102f45;stroke:#67d5ff;stroke-width:2}.warn{fill:#2a2110;stroke:#e7b24a;stroke-width:2}.bad{fill:#2a1418;stroke:#ef6b7b;stroke-width:2}.t{font:700 23px Arial;fill:#eaf7ff}.s{font:14px Arial;fill:#92b0c5}.k{font:700 13px Arial;fill:#67d5ff;letter-spacing:1px}.line{stroke:#3f7998;stroke-width:3;fill:none;marker-end:url(#a)}.dash{stroke:#e7b24a;stroke-width:3;stroke-dasharray:8 7;fill:none;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#67d5ff"/></marker></defs><text class="k" x="80" y="75">K12 OPS · V5 ENTERPRISE OPERATIONS</text><text class="t" x="80" y="120" style="font-size:40px">Service Dependency &amp; Blast Radius</text>
<rect class="hi" x="650" y="180" width="300" height="100" rx="18"/><text class="t" x="705" y="225">Instructional SaaS</text><text class="s" x="720" y="252">User-facing service</text>
<rect class="node" x="140" y="390" width="250" height="90" rx="16"/><text class="t" x="220" y="430">DNS</text><text class="s" x="187" y="458">name resolution</text>
<rect class="node" x="470" y="390" width="250" height="90" rx="16"/><text class="t" x="535" y="430">Identity</text><text class="s" x="522" y="458">auth / policy</text>
<rect class="node" x="800" y="390" width="250" height="90" rx="16"/><text class="t" x="858" y="430">Web Filter</text><text class="s" x="842" y="458">category / TLS</text>
<rect class="node" x="1130" y="390" width="250" height="90" rx="16"/><text class="t" x="1200" y="430">WAN</text><text class="s" x="1184" y="458">upstream path</text>
<path class="line" d="M760 280 L300 390"/><path class="line" d="M800 280 L595 390"/><path class="line" d="M840 280 L925 390"/><path class="line" d="M875 280 L1255 390"/>
<rect class="node" x="800" y="620" width="250" height="90" rx="16"/><text class="t" x="850" y="660">Firewall</text><text class="s" x="842" y="688">policy boundary</text>
<rect class="bad" x="1130" y="620" width="250" height="90" rx="16"/><text class="t" x="1175" y="660">Provider</text><text class="s" x="1160" y="688">external dependency</text>
<path class="line" d="M925 480 L925 620"/><path class="line" d="M1255 480 L1255 620"/><text class="s" x="80" y="820">A single user symptom can cross endpoint, identity, security, WAN, and external-provider dependencies. Blast-radius analysis makes that relationship explicit.</text>
</svg>