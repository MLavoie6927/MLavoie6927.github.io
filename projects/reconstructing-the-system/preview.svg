    <g fill="#c9f6ff"><text x="132" y="179">S-01</text><text x="132" y="259">S-02</text><text x="132" y="339">S-03</text><text x="132" y="419">S-04</text><text x="132" y="499">S-05</text><text x="132" y="579">S-06</text></g>
