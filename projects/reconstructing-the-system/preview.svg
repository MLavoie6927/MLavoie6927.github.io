<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Reconstructing the System source-lineage map</title>
  <desc id="desc">Twelve protected source nodes converge through contaminated reporting chains on senior analyst Darek Miris, who separates fused events before a national warning decision.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07110f"/><stop offset="1" stop-color="#020605"/></linearGradient>
    <radialGradient id="halo"><stop offset="0" stop-color="#68e0ae" stop-opacity=".28"/><stop offset="1" stop-color="#68e0ae" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="8" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="760" rx="22" fill="url(#bg)"/>
  <g stroke="#16362d" stroke-width="1" opacity=".58">
    <path d="M0 100h1200M0 200h1200M0 300h1200M0 400h1200M0 500h1200M0 600h1200M0 700h1200"/>
    <path d="M100 0v760M200 0v760M300 0v760M400 0v760M500 0v760M600 0v760M700 0v760M800 0v760M900 0v760M1000 0v760M1100 0v760"/>
  </g>
  <text x="62" y="64" fill="#68e0ae" font-family="Consolas, monospace" font-size="20" font-weight="700" letter-spacing="3">PROTECTED SOURCE LINEAGE</text>
  <text x="62" y="92" fill="#8ca69c" font-family="Segoe UI, sans-serif" font-size="17">Apparent corroboration collapses when shared origins are reconstructed.</text>
